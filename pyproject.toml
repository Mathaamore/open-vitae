[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vitae"
version = "0.3.1"
description = "Local open-source job search and application preparation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "playwright>=1.49,<2", "pypdf>=6,<7", "reportlab>=4,<5", "keyring>=25,<27"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
job-agent = "job_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_agent = ["web/*"]
