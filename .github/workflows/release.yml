name: macOS release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (v0.3.1)
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-15
    environment: macos-release
    permissions:
      contents: write
    env:
      JOB_AGENT_ROOT: /tmp/open-vitae-release-tests
      MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      SPARKLE_ROOT: ${{ runner.temp }}/sparkle
      NOTARY_KEYCHAIN_PROFILE: open-vitae-notary
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and architecture
        run: |
          test "$(uname -m)" = arm64
          python -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v"+tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
      - name: Install build dependencies
        run: |
          python -m pip install -e '.[test]' 'pyinstaller>=6,<7'
          npm install --global @openai/codex@0.147.0
          PLAYWRIGHT_BROWSERS_PATH=/tmp/candidatures-browsers python -m playwright install chromium --only-shell
      - name: Select bundled native Codex (npm command is a launcher)
        run: |
          python - <<'PYCODE'
          import os, pathlib, subprocess
          root = pathlib.Path(subprocess.check_output(['npm','root','-g'],text=True).strip())
          binaries = list(root.glob('@openai/**/vendor/aarch64-apple-darwin/codex/codex'))
          assert len(binaries) == 1, 'Expected exactly one official Apple Silicon Codex binary'
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write(f'CODEX_BINARY={binaries[0]}\n')
          PYCODE
      - name: Tests
        run: |
          python -m unittest discover -s tests -q
          node --test tests/test_web.js
          python scripts/check_repository.py
          PLAYWRIGHT_BROWSERS_PATH=/tmp/candidatures-browsers python scripts/check_product_ui.py
      - name: Import release credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          python -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"certificate.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE"],validate=True))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          xcrun notarytool store-credentials "$NOTARY_KEYCHAIN_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --keychain "$RUNNER_TEMP/release.keychain-db"
      - name: Download checksum-pinned Sparkle distribution
        env:
          SPARKLE_ARCHIVE_URL: ${{ vars.SPARKLE_ARCHIVE_URL }}
          SPARKLE_SHA256: ${{ vars.SPARKLE_SHA256 }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"https://github.com/sparkle-project/Sparkle/releases/download/[^/]+/Sparkle-[^/]+\.tar\.xz",os.environ["SPARKLE_ARCHIVE_URL"]); assert re.fullmatch(r"[0-9a-f]{64}",os.environ["SPARKLE_SHA256"])'
          curl --fail --location --proto '=https' --tlsv1.2 "$SPARKLE_ARCHIVE_URL" -o "$RUNNER_TEMP/sparkle.tar.xz"
          printf '%s  %s\n' "$SPARKLE_SHA256" "$RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 --check
          mkdir -p "$SPARKLE_ROOT"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$SPARKLE_ROOT"
      - name: Build, sign and notarize
        run: |
          python macos/build.py --release
          python scripts/check_macos_bundle.py
          python macos/distribute.py
      - name: Sign update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_PREFIX: https://github.com/Mathaamore/open-vitae/releases/download/${{ inputs.tag }}/
        run: |
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          mkdir -p "$RUNNER_TEMP/updates"
          python -c 'import html,pathlib; pathlib.Path("dist/Open-vitae-Mac.html").write_text("<!doctype html><html lang=fr><meta charset=utf-8><title>Open Vitæ</title><pre>"+html.escape(pathlib.Path("CHANGELOG.md").read_text())+"</pre></html>")'
          cp dist/Open-vitae-Mac.html "$RUNNER_TEMP/updates/"
          cp dist/Open-vitae-Mac.zip "$RUNNER_TEMP/updates/"
          "$SPARKLE_ROOT/bin/generate_appcast" --ed-key-file "$RUNNER_TEMP/sparkle-key" --download-url-prefix "$DOWNLOAD_PREFIX" --release-notes-url-prefix "$DOWNLOAD_PREFIX" "$RUNNER_TEMP/updates"
          cp "$RUNNER_TEMP/updates/appcast.xml" dist/appcast.xml
          cp "$RUNNER_TEMP/updates/Open-vitae-Mac.html" dist/Open-vitae-Mac.html
      - name: Save exact dependency inventory
        run: python -m pip freeze > dist/build-requirements.txt
      - name: Create draft only; publish after clean-Mac acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/Open-vitae-Mac.dmg dist/Open-vitae-Mac.zip dist/SHA256SUMS dist/appcast.xml dist/Open-vitae-Mac.html dist/build-requirements.txt --draft --title "Open Vitæ $RELEASE_TAG" --notes-file CHANGELOG.md
      - name: Remove credentials
        if: always()
        run: |
          security default-keychain -d user -s login.keychain-db
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/sparkle-key"
