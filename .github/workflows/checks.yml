name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      JOB_AGENT_ROOT: ${{ runner.temp }}/open-vitae-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/test_web.js
  product-journey:
    runs-on: ubuntu-latest
    env:
      JOB_AGENT_ROOT: ${{ runner.temp }}/open-vitae-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python scripts/check_product_ui.py
